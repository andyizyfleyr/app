function makeApp(s,i){const [id,name,developer,category,rating,reviewCount,downloads,size,cost,glyph,palette,tagline]=s;return {id,name,developer,category,rating,reviewCount,downloads,size,price:cost,glyph,palette,tagline,version:`${2+i%4}.${i%7}.${i%3}`,date:`2026-${String(10-i%3).padStart(2,'0')}-${String(15-i%14).padStart(2,'0')}`,android:'9.0 ou version ultérieure',age:category==='Réseaux sociaux'?'12+':'3+',description:`${tagline}\n\n${DESCRIPTIONS[category]}\n\nConçue par ${developer}, ${name} met la simplicité au premier plan : une navigation fluide, un mode sombre et une attention particulière à l’accessibilité. Personnalisez votre expérience et retrouvez vos préférences à chaque ouverture.\n\nVos données vous appartiennent. Aucune revente de données personnelles et des permissions demandées uniquement lorsque vous en avez besoin.`,whatsNew:'Une nouvelle version, encore plus agréable.\n• Une navigation repensée pour aller à l’essentiel.\n• De nouvelles options de personnalisation.\n• Des performances améliorées et quelques petits bugs en moins.',permissions:category==='Photo'?['Photos et vidéos (sur autorisation)','Notifications (facultatives)']:category==='Santé'?['Activité physique (sur autorisation)','Notifications (facultatives)']:['Accès au réseau','Notifications (facultatives)'],screenshots:['Votre nouvel espace','Pensé pour vous','Les petits détails','À votre rythme'],reviews:[{name:'Camille D.',rating:5,date:'2026-10-10',text:'Une très belle découverte ! L’interface est soignée et tout est facile à trouver. Exactement ce que je cherchais.'},{name:'Alex M.',rating:4,date:'2026-10-05',text:'Simple, agréable et efficace au quotidien. J’aimerais encore plus de personnalisation, mais c’est déjà une réussite.'},{name:'Sarah L.',rating:5,date:'2026-09-28',text:'Enfin une application qui va à l’essentiel. Le mode sombre est vraiment réussi. Je recommande !'}]};}

const state = {installed:new Set(validIds(storage.read('installed',[]))),wishes:new Set(validIds(storage.read('wishes',[]))),reviews:{},category:'Tout',libraryTab:'installed',slide:0,heroPaused:false,downloading:new Map(),viewer:{id:null,index:0},uninstallId:null,query:'',toastTimer:null};

const persist = () => {storage.write('installed',[...state.installed]);storage.write('wishes',[...state.wishes]);};

function appIcon(a,cls=''){const [c1,c2]=PALETTES[a.palette];const p=appGlyphs[a.glyph];return `<svg class="app-icon ${cls}" viewBox="0 0 64 64" role="img" aria-label="Icône de ${esc(a.name)}"><rect width="64" height="64" rx="16" fill="${c1}"/><path d="M0 50Q30 21 64 28v36H0Z" fill="${c2}" opacity=".3"/><g stroke="#fff" color="#fff" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${p||`<g transform="translate(9 9) scale(1.9)">${paths[a.glyph]||paths.spark}</g>`}</g></svg>`;}

/* 5. RENDU DES PAGES ET DES COMPOSANTS */
function highlight(text,q){if(!q)return esc(text);const start=text.toLocaleLowerCase('fr').indexOf(q.toLocaleLowerCase('fr'));return start<0?esc(text):esc(text.slice(0,start))+'<mark>'+esc(text.slice(start,start+q.length))+'</mark>'+esc(text.slice(start+q.length));}
function appCard(a,q=''){return `<article class="app-card"><a href="#/app/${a.id}" aria-label="${esc(a.name)}, ${rating(a)} sur 5, ${esc(price(a))}"><div class="app-cover" style="--card-bg:${PALETTES[a.palette][2]}">${appIcon(a)}${state.installed.has(a.id)?`<span class="card-installed" title="Installée">${icon('check')}</span>`:''}</div><h3>${highlight(a.name,q)}</h3><span class="category">${esc(a.category)}</span><div class="rating-line">${rating(a)} ${icon('star')}<span class="sep">·</span>${a.price?esc(price(a)):esc(a.size+' Mo')}</div></a></article>`;}
function rankCard(a,index){return `<a class="rank-card" href="#/app/${a.id}"><span class="rank-number">${index+1}</span>${appIcon(a)}<div class="rank-info"><h3>${esc(a.name)}</h3><p>${esc(a.category)}</p><div class="rating-line">${rating(a)} ${icon('star')}<span class="sep">·</span>${fmt(a.downloads)} téléchargements</div></div></a>`;}
function row(title,subtitle,apps,key,query){if(!apps.length)return '';return `<section class="section" aria-labelledby="heading-${key}"><div class="section-head"><div><div class="section-title"><h2 id="heading-${key}">${esc(title)}</h2>${key==='new'?'<span class="badge">À découvrir</span>':''}</div><p class="section-subtitle">${esc(subtitle)}</p></div><div class="section-actions"><a class="text-link" href="#/search?${esc(query)}">Tout voir ${icon('arrow')}</a><button class="icon-btn" data-action="scroll-row" data-row="${key}" data-direction="-1" aria-label="Faire défiler ${esc(title)} vers la gauche">${icon('left')}</button><button class="icon-btn" data-action="scroll-row" data-row="${key}" data-direction="1" aria-label="Faire défiler ${esc(title)} vers la droite">${icon('right')}</button></div></div><div class="horizontal" id="row-${key}">${apps.map(a=>appCard(a)).join('')}</div></section>`;}
const SLIDES=[{id:'folia',label:'La sélection de la rédaction',title:'Un peu d’ordre.<br>Beaucoup d’idées.',text:'Vos notes, vos projets, vos petites victoires. Avec Folia, faites de la place à l’essentiel.',cta:'Découvrir Folia',extra:'luma',extra2:'sonora'}, {id:'zenli',label:'Votre moment à vous',title:'Inspirez.<br>Le reste attendra.',text:'Cinq minutes pour ralentir. Découvrez Zenli et retrouvez votre équilibre, un jour à la fois.',cta:'Prendre une pause',extra:'vento',extra2:'nocti'}, {id:'cosmio',label:'Évadez-vous, tout simplement',title:'Petite pause.<br>Grandes aventures.',text:'Des mondes à explorer, des étoiles à collectionner. Votre prochaine évasion commence ici.',cta:'Explorer Cosmio',extra:'orbia',extra2:'cubiko'}];

function homePage(){const filtered=state.category==='Tout'?APPS:APPS.filter(a=>a.category===state.category);const cat=state.category==='Tout'?'':`&category=${encodeURIComponent(state.category)}`;return `<div class="page"><nav class="category-strip" aria-label="Catégories">${CATEGORIES.map(c=>`<button class="chip ${c===state.category?'active':''}" data-action="category" data-category="${esc(c)}" aria-pressed="${c===state.category}">${c==='Tout'?icon('grid'):c==='Jeux'?icon('game'):''}${esc(c)}</button>`).join('')}</nav>${state.category==='Tout'?`<section aria-label="À la une" aria-roledescription="carrousel" id="featured"><div class="hero" id="hero" role="group" aria-roledescription="diapositive" aria-label="Sélection ${state.slide+1} sur 3">${heroContent()}</div><div class="hero-controls" id="hero-controls">${heroControls()}</div></section>`:`<div class="page-heading"><div><h1>${esc(state.category)}</h1><p>Des applications bien pensées. De belles découvertes en perspective.</p></div><span class="badge">${filtered.length} apps</span></div>`}${row('Tendances','Les apps qui font parler d’elles en ce moment.',[...filtered].sort((a,b)=>b.downloads-a.downloads).slice(0,9),'trends','sort=downloads'+cat)}${row('Nouveautés','Un vent de fraîcheur sur votre écran.',[...filtered].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8),'new','sort=recent'+cat)}<aside class="editorial">${icon('shield')}<div><h3>Les bonnes apps, en toute confiance.</h3><p>Des découvertes originales. Une expérience sans distraction.</p></div><a href="#/search" class="text-link">Explorez le catalogue ${icon('arrow')}</a></aside>${row('Meilleures notes','Approuvées par les plus curieux.',[...filtered].sort((a,b)=>b.rating-a.rating).slice(0,8),'rated','sort=rating'+cat)}${(state.category==='Tout'||state.category==='Jeux')?row('Jeux populaires','Juste une partie ? On ne vous promet rien.',APPS.filter(a=>a.category==='Jeux').sort((a,b)=>b.downloads-a.downloads),'games','category=Jeux&sort=downloads'):''}<section class="section"><div class="section-head"><div><h2>Top gratuites</h2><p class="section-subtitle">Le meilleur des apps, sans dépenser un centime.</p></div><a class="text-link" href="#/search?price=free&sort=downloads${esc(cat)}">Tout voir ${icon('arrow')}</a></div><div class="rank-grid">${filtered.filter(a=>!a.price).sort((a,b)=>b.downloads-a.downloads).slice(0,9).map(rankCard).join('')}</div></section></div>`;}
function emptyState(symbol,title,text,cta='Explorer les apps',href='#/'){return `<div class="empty"><div class="empty-icon">${icon(symbol)}</div><h2>${esc(title)}</h2><p>${esc(text)}</p><a class="btn primary" href="${esc(href)}">${esc(cta)} ${icon('arrow')}</a></div>`;}
function searchApps(q){const clean=q.toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return APPS.filter(a=>[a.name,a.developer,a.category,a.tagline].some(v=>v.toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(clean)));}
function filteredApps(params){const q=params.get('q')||'';let list=searchApps(q);const cat=params.get('category'),min=Number(params.get('rating')||0),cost=params.get('price'),sort=params.get('sort')||'relevance';if(cat&&cat!=='Tout')list=list.filter(a=>a.category===cat);if(min)list=list.filter(a=>Number(rating(a))>=min);if(cost==='free')list=list.filter(a=>!a.price);if(cost==='paid')list=list.filter(a=>a.price);return list.sort((a,b)=>sort==='rating'?b.rating-a.rating:sort==='downloads'?b.downloads-a.downloads:sort==='recent'?b.date.localeCompare(a.date):(a.name.toLowerCase()===q.toLowerCase()?-1:b.name.toLowerCase()===q.toLowerCase()?1:b.downloads-a.downloads));}
function selectOptions(options,value){return options.map(([v,t])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('');}
function searchPage(params){const q=params.get('q')||'',apps=filteredApps(params);return `<div class="page page-top"><div class="page-heading"><div><span class="eyebrow muted">Trouvez votre prochaine favorite</span><h1 style="margin-top:10px">${q?'Résultats pour « '+esc(q)+' »':'À chaque envie, son app.'}</h1><p role="status">${apps.length} application${apps.length>1?'s':''} ${q?'trouvée'+(apps.length>1?'s':''):'à découvrir'}</p></div></div><form class="filters" id="filters"><div class="filter"><label for="filter-category">Catégorie</label><select id="filter-category" name="category">${selectOptions(CATEGORIES.map(c=>[c,c==='Tout'?'Toutes les catégories':c]),params.get('category')||'Tout')}</select></div><div class="filter"><label for="filter-rating">Note minimale</label><select id="filter-rating" name="rating">${selectOptions([['0','Toutes les notes'],['4','4 étoiles et plus'],['4.5','4,5 étoiles et plus'],['4.8','4,8 étoiles et plus']],params.get('rating')||'0')}</select></div><div class="filter"><label for="filter-price">Prix</label><select id="filter-price" name="price">${selectOptions([['all','Tous les prix'],['free','Gratuit'],['paid','Payant']],params.get('price')||'all')}</select></div><div class="filter"><label for="filter-sort">Trier par</label><select id="filter-sort" name="sort">${selectOptions([['relevance','Pertinence'],['rating','Meilleures notes'],['downloads','Téléchargements'],['recent','Plus récentes']],params.get('sort')||'relevance')}</select></div></form>${apps.length?`<div class="result-grid">${apps.map(a=>appCard(a,q)).join('')}</div>`:emptyState('search','Aucune app à l’horizon','Essayez un nom plus court, une autre catégorie ou des filtres moins restrictifs.','Réinitialiser la recherche','#/search')}</div>`;}
function installContent(a){const d=state.downloading.get(a.id);if(d)return `<button class="btn primary" disabled>${icon('download')}${d.progress<100?'Téléchargement…':'Installation…'}</button><div class="install-progress" role="progressbar" aria-valuenow="${Math.round(d.progress)}" aria-valuemin="0" aria-valuemax="100" aria-label="Installation de ${esc(a.name)}"><span style="width:${d.progress}%"></span></div><p class="progress-label" aria-live="polite">${d.progress<100?Math.round(d.progress)+' % · Simulation locale':'Presque terminé…'}</p>`;if(state.installed.has(a.id))return `<div class="installed-buttons"><button class="btn primary" data-action="open-app" data-id="${a.id}">${icon('play')} Ouvrir</button><button class="icon-btn" data-action="uninstall" data-id="${a.id}" aria-label="Désinstaller ${esc(a.name)}" title="Désinstaller">${icon('trash')}</button></div>`;return `<button class="btn primary" data-action="install" data-id="${a.id}">${icon('download')} ${a.price?'Installer · '+esc(price(a)):'Installer'}</button><p class="progress-label">${a.price?'Démo · Aucun paiement réel':'Installation simulée · Aucun fichier téléchargé'}</p>`;}
function wishButton(a){const saved=state.wishes.has(a.id);return `<button class="icon-btn" data-action="wish" data-id="${a.id}" aria-label="${saved?'Retirer '+esc(a.name)+' des souhaits':'Ajouter '+esc(a.name)+' aux souhaits'}" aria-pressed="${saved}" title="${saved?'Retirer des souhaits':'Ajouter aux souhaits'}" style="color:var(--primary)">${icon('heart',saved?'filled':'')}</button>`;}
function reviewCard(r){return `<article class="review"><div class="review-head"><span class="avatar" aria-hidden="true">${esc(r.name.slice(0,1).toUpperCase())}</span><strong>${esc(r.name)}</strong></div><div class="review-meta"><span class="stars" aria-label="${r.rating} étoiles sur 5">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><time datetime="${esc(r.date)}">${esc(dateFmt(r.date))}</time></div><p>${esc(r.text)}</p></article>`;}
function detailPage(a){const count=a.reviewCount+(state.reviews[a.id]?.length||0);const similar=APPS.filter(b=>b.category===a.category&&b.id!==a.id);return `<div class="page page-top"><nav class="breadcrumb" aria-label="Fil d’Ariane"><a href="#/">Découvrir</a>${icon('right')}<a href="#/search?category=${encodeURIComponent(a.category)}">${esc(a.category)}</a>${icon('right')}<span aria-current="page">${esc(a.name)}</span></nav><section aria-label="Présentation de l’application"><div class="detail-header">${appIcon(a)}<div><div class="eyebrow muted">Votre prochaine découverte</div><h1>${esc(a.name)}</h1><p class="developer">${esc(a.developer)}</p><div class="detail-tags"><a class="badge" href="#/search?category=${encodeURIComponent(a.category)}">${esc(a.category)}</a><span class="badge">${esc(price(a))}</span></div></div><div class="detail-actions"><div class="install-group" data-install="${a.id}">${installContent(a)}</div><span data-wish="${a.id}">${wishButton(a)}</span></div></div><div class="app-stats"><div class="app-stat"><strong>${rating(a)} ${icon('star')}</strong><p>${fmt(count)} avis</p></div><div class="app-stat"><strong>${fmt(a.downloads)}+</strong><p>Téléchargements</p></div><div class="app-stat"><strong>${a.size} Mo</strong><p>Taille de l’app</p></div><div class="app-stat"><strong>${a.age}</strong><p>Âge minimum</p></div></div><div class="screenshots" aria-label="Captures d’écran">${a.screenshots.map((s,i)=>`<button class="shot-btn" data-action="view-shot" data-id="${a.id}" data-index="${i}" aria-label="Agrandir : ${esc(s)}">${screenshot(a,i)}</button>`).join('')}</div></section><div class="detail-columns"><div><section class="content-section"><h2>À propos de cette app</h2><p class="description collapsed" id="description">${esc(a.description)}</p><button class="text-link" data-action="read-more" aria-expanded="false" aria-controls="description">Lire la suite ${icon('right')}</button><div class="new-features"><h3>Quoi de neuf ? <span class="badge">v${esc(a.version)}</span></h3><p>${esc(a.whatsNew)}</p></div></section><section class="content-section" aria-labelledby="reviews-title"><div class="section-head"><h2 id="reviews-title">Notes et avis</h2><button class="text-link" data-action="toggle-review" aria-expanded="false" aria-controls="review-form">Donner mon avis ${icon('arrow')}</button></div><div class="rating-summary"><div class="big-rating"><strong>${rating(a)}</strong><div class="stars" aria-label="${rating(a)} sur 5">★★★★★</div><small>${fmt(count)} avis</small></div><div class="rating-bars" aria-label="Répartition des notes">${[5,4,3,2,1].map((n,i)=>`<div class="rating-bar"><span>${n}</span><div class="rating-track" role="meter" aria-label="${n} étoiles" aria-valuenow="${[76,16,5,2,1][i]}" aria-valuemin="0" aria-valuemax="100"><span style="width:${[76,16,5,2,1][i]}%"></span></div></div>`).join('')}</div></div><form id="review-form" class="review-form" data-id="${a.id}" hidden><h3>Votre expérience compte.</h3><p class="muted" style="font-size:11px;margin-top:6px">Avis stocké uniquement dans ce navigateur.</p><label for="review-name">Votre prénom ou pseudo</label><input class="field" id="review-name" name="name" required minlength="2" maxlength="40" placeholder="Camille" autocomplete="nickname"><label for="review-rating">Votre note</label><select class="field" id="review-rating" name="rating" required><option value="">Choisissez une note</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${n} étoile${n>1?'s':''}</option>`).join('')}</select><label for="review-text">Votre avis</label><textarea class="field" id="review-text" name="text" required minlength="10" maxlength="1000" placeholder="Ce qui vous a plu, ce qui pourrait être amélioré…"></textarea><button class="btn primary" type="submit">Publier mon avis ${icon('arrow')}</button></form>${getReviews(a).map(reviewCard).join('')}</section></div><aside class="info-panel"><h2>Informations</h2>${[['Version',a.version],['Mise à jour',dateFmt(a.date)],['Android requis',a.android],['Taille',a.size+' Mo'],['Classification',a.age],['Développeur',a.developer]].map(([k,v])=>`<div class="info-row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}<details><summary>Permissions ${icon('info')}</summary><ul>${a.permissions.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="muted" style="font-size:10px">Données de démonstration. Aucune permission réelle n’est demandée.</p></details></aside></div>${row('Vous aimerez aussi','D’autres belles découvertes vous attendent.',similar,'similar','category='+encodeURIComponent(a.category))}</div>`;}
function libraryPage(){const ids=state.libraryTab==='installed'?state.installed:state.wishes;const apps=APPS.filter(a=>ids.has(a.id));return `<div class="page page-top"><div class="page-heading"><div><span class="eyebrow muted">Votre petit univers</span><h1 style="margin-top:10px">Mes applications</h1><p>Vos indispensables et vos prochaines découvertes, au même endroit.</p></div>${icon('grid')}</div><div class="tabs" role="tablist" aria-label="Ma bibliothèque"><button id="tab-installed" class="tab ${state.libraryTab==='installed'?'active':''}" role="tab" aria-controls="library-panel" aria-selected="${state.libraryTab==='installed'}" tabindex="${state.libraryTab==='installed'?0:-1}" data-action="library-tab" data-tab="installed">Installées <span class="tab-count">${state.installed.size}</span></button><button id="tab-wishes" class="tab ${state.libraryTab==='wishes'?'active':''}" role="tab" aria-controls="library-panel" aria-selected="${state.libraryTab==='wishes'}" tabindex="${state.libraryTab==='wishes'?0:-1}" data-action="library-tab" data-tab="wishes">Liste de souhaits <span class="tab-count">${state.wishes.size}</span></button></div><section id="library-panel" role="tabpanel" aria-labelledby="tab-${state.libraryTab}">${apps.length?`<div class="library-grid">${apps.map(a=>`<article class="library-card"><a href="#/app/${a.id}" aria-label="Voir ${esc(a.name)}">${appIcon(a)}</a><a href="#/app/${a.id}" class="lib-info"><h3>${esc(a.name)}</h3><p>${esc(a.category)} · ${a.size} Mo · ${rating(a)} ★</p></a>${state.libraryTab==='installed'?`<button class="btn secondary" data-action="open-app" data-id="${a.id}">Ouvrir</button><button class="icon-btn" data-action="uninstall" data-id="${a.id}" aria-label="Désinstaller ${esc(a.name)}">${icon('trash')}</button>`:`<a class="btn secondary" href="#/app/${a.id}">Découvrir</a><button class="icon-btn" data-action="wish" data-id="${a.id}" aria-label="Retirer ${esc(a.name)} des souhaits">${icon('close')}</button>`}</article>`).join('')}</div>`:state.libraryTab==='installed'?emptyState('download','Votre collection commence ici','Installez votre première application pour la retrouver ici. Les installations sont simulées, sans téléchargement.'):emptyState('heart','Gardez vos coups de cœur','Touchez le cœur sur la page d’une app pour la retrouver ici, quand vous le souhaitez.')}</section></div>`;}

/* 6. ROUTEUR HASH — fonctionne également en file://. */
function getRoute(){const raw=(location.hash.slice(1)==='main'?'/':location.hash.slice(1)||'/');const split=raw.indexOf('?');return {path:split<0?raw:raw.slice(0,split),params:new URLSearchParams(split<0?'':raw.slice(split+1))};}
function setTitle(text){document.title=`${text} — ${PLATFORM_NAME}`;}
function updateNav(path,params){$$('[data-nav]').forEach(el=>{const key=el.dataset.nav;const active=key==='home'?path==='/':key==='library'?path==='/library':key==='games'?path==='/search'&&params.get('category')==='Jeux':path==='/search';el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});}
function render({scroll=false,focus=false}={}){heroHovered=false;heroFocused=false;const {path,params}=getRoute();const main=$('#main');const isSearch=path==='/search';state.query=isSearch?(params.get('q')||''):'';if(document.activeElement!==$('#search'))$('#search').value=state.query;
if(path==='/'){main.innerHTML=homePage();setTitle('De belles découvertes, chaque jour');}
else if(isSearch){main.innerHTML=searchPage(params);setTitle(state.query?'Recherche : '+state.query:'Explorer les applications');}
else if(path==='/library'){main.innerHTML=libraryPage();setTitle('Mes applications');}
else if(path.startsWith('/app/')&&appById(path.slice(5))){const a=appById(path.slice(5));main.innerHTML=detailPage(a);setTitle(a.name+' — '+a.tagline);}
else{main.innerHTML='<div class="page page-top">'+emptyState('leaf','Cette page a pris son envol.','L’adresse ne mène à aucune application. Pas d’inquiétude, de belles découvertes vous attendent à l’accueil.','Revenir à l’accueil')+'</div>';setTitle('Page introuvable');}
updateNav(path,params);if(scroll)window.scrollTo({top:0,behavior:'instant'});if(focus)main.focus({preventScroll:true});}
let liveRouting=false;
window.addEventListener('hashchange',()=>{clearTimeout(searchTimer);if(!liveRouting)closeSuggestions();if($('#viewer').open)$('#viewer').close();if($('#confirm-dialog').open)$('#confirm-dialog').close();render({scroll:!liveRouting,focus:!liveRouting});liveRouting=false;});
function navigateSearch(q,live=false){const current=getRoute();const p=current.path==='/search'?current.params:new URLSearchParams();q=q.trim().slice(0,100);if(q)p.set('q',q);else p.delete('q');const hash='#/search'+(p.toString()?'?'+p:'');if(location.hash!==hash){liveRouting=live;location.hash=hash;}else if(!live){closeSuggestions();$('#main').focus();}}

/* 7. ACTIONS : installation simulée, souhaits, toasts et formulaires. */
let toastUndo=null;
function toast(text,undo=null){clearTimeout(state.toastTimer);toastUndo=undo;$('#toast').innerHTML=`${icon('check')}<span>${esc(text)}</span>${undo?'<button data-action="undo">Annuler</button>':'<button data-action="dismiss-toast" aria-label="Fermer la notification">'+icon('close')+'</button>'}`;$('#toast').hidden=false;state.toastTimer=setTimeout(()=>{$('#toast').hidden=true;toastUndo=null;},8000);}
function refreshInstall(id){$$(`[data-install="${id}"]`).forEach(el=>{el.innerHTML=installContent(appById(id));});}
function startInstall(id){const a=appById(id);if(!a||state.installed.has(id)||state.downloading.has(id))return;const d={progress:0,timer:null};state.downloading.set(id,d);refreshInstall(id);d.timer=setInterval(()=>{d.progress=Math.min(100,d.progress+8+Math.random()*10);refreshInstall(id);if(d.progress===100){clearInterval(d.timer);setTimeout(()=>{state.downloading.delete(id);state.installed.add(id);persist();refreshInstall(id);if(getRoute().path==='/library')render();toast(`${a.name} : application installée`,()=>{state.installed.delete(id);persist();render();toast('Installation annulée');});},900);}},320);}
function toggleWish(id){const a=appById(id);if(!a)return;const was=state.wishes.has(id);if(was)state.wishes.delete(id);else state.wishes.add(id);persist();if(getRoute().path==='/library')render();else $$(`[data-wish="${id}"]`).forEach(el=>{el.innerHTML=wishButton(a);});toast(was?'Retirée de la liste de souhaits':'Ajoutée aux souhaits',()=>{if(was)state.wishes.add(id);else state.wishes.delete(id);persist();render();toast('Modification annulée');});}
function requestUninstall(id){const a=appById(id);if(!a||!state.installed.has(id))return;state.uninstallId=id;$('#confirm-text').textContent=`Voulez-vous retirer ${a.name} de vos applications installées ? Vous pourrez la réinstaller à tout moment.`;$('#confirm-dialog').showModal();}
$('#confirm-uninstall').addEventListener('click',()=>{const id=state.uninstallId;if(!appById(id))return;state.installed.delete(id);persist();$('#confirm-dialog').close();render();toast(`${appById(id).name} a été désinstallée`,()=>{state.installed.add(id);persist();render();toast('Application restaurée');});});
function submitReview(form){const data=new FormData(form),name=String(data.get('name')).trim(),text=String(data.get('text')).trim(),score=Number(data.get('rating'));const nameInput=$('#review-name'),textInput=$('#review-text');nameInput.setCustomValidity(name.length<2?'Saisissez au moins 2 caractères.':'');textInput.setCustomValidity(text.length<10?'Racontez votre expérience en au moins 10 caractères.':'');if(!form.reportValidity()||score<1||score>5)return;const id=form.dataset.id,r={name:name.slice(0,40),text:text.slice(0,1000),rating:score,date:new Date().toISOString().slice(0,10)};state.reviews[id]=[r,...(state.reviews[id]||[])].slice(0,50);storage.write('reviews',state.reviews);render();$('#reviews-title').scrollIntoView({block:'start',behavior:motion.matches?'instant':'smooth'});toast('Merci ! Votre avis a été publié.');}

/* 8. CARROUSEL ET VISIONNEUSE */
let heroHovered=false,heroFocused=false;
function changeSlide(index){state.slide=(index+SLIDES.length)%SLIDES.length;const hero=$('#hero');if(!hero)return;hero.innerHTML=heroContent();hero.setAttribute('aria-label',`Sélection ${state.slide+1} sur ${SLIDES.length}`);$('#hero-controls').innerHTML=heroControls();}
setInterval(()=>{if(!state.heroPaused&&!heroHovered&&!heroFocused&&!document.hidden&&!motion.matches&&getRoute().path==='/'&&state.category==='Tout')changeSlide(state.slide+1);},6500);
function showShot(id,index){const a=appById(id);if(!a)return;state.viewer={id,index:(index+a.screenshots.length)%a.screenshots.length};$('#viewer-shot').innerHTML=screenshot(a,state.viewer.index);$('#viewer-count').textContent=`${a.name} · ${a.screenshots[state.viewer.index]} · ${state.viewer.index+1} / ${a.screenshots.length}`;if(!$('#viewer').open)$('#viewer').showModal();}
const nextShot=delta=>showShot(state.viewer.id,state.viewer.index+delta);
let touchStart=null;
$('#main').addEventListener('pointerover',e=>{if(e.target.closest('#featured'))heroHovered=true;});
$('#main').addEventListener('pointerout',e=>{if(e.target.closest('#featured')&&!e.relatedTarget?.closest?.('#featured'))heroHovered=false;});
$('#main').addEventListener('focusin',e=>{if(e.target.closest('#featured'))heroFocused=true;});
$('#main').addEventListener('focusout',e=>{if(e.target.closest('#featured')&&!e.relatedTarget?.closest?.('#featured'))heroFocused=false;});
$('#main').addEventListener('touchstart',e=>{if(e.target.closest('#hero'))touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
$('#main').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))changeSlide(state.slide+(dx<0?1:-1));},{passive:true});

/* 9. RECHERCHE AVEC DEBOUNCE ET NAVIGATION CLAVIER */
let searchTimer;
function closeSuggestions(){$('#suggestions').hidden=true;$('#search').setAttribute('aria-expanded','false');}
function showSuggestions(q){if(!q.trim()){closeSuggestions();return;}const apps=searchApps(q).slice(0,4);$('#suggestions').innerHTML=apps.length?apps.map(a=>`<a href="#/app/${a.id}" class="suggestion">${appIcon(a)}<span><strong>${highlight(a.name,q)}</strong><small>${esc(a.category)} · ${rating(a)} ★</small></span></a>`).join(''):`<p class="muted" style="font-size:12px;padding:12px">Aucune app pour « ${esc(q)} ». Essayez un autre mot.</p>`;$('#suggestions').innerHTML+=`<a class="all-results" href="#/search?q=${encodeURIComponent(q)}">Voir tous les résultats ${icon('arrow')}</a>`;$('#suggestions').hidden=false;$('#search').setAttribute('aria-expanded','true');}
$('#search').addEventListener('input',e=>{clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>{if(getRoute().path==='/search')navigateSearch(q,true);showSuggestions(q);},200);});
$('#search').addEventListener('focus',e=>{if(getRoute().path!=='/search')showSuggestions(e.target.value);});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();clearTimeout(searchTimer);navigateSearch($('#search').value);closeSuggestions();});
$('#search').addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&!$('#suggestions').hidden){e.preventDefault();$('#suggestions a')?.focus();}if(e.key==='Escape')closeSuggestions();});
$('#suggestions').addEventListener('keydown',e=>{const links=$$('a',$('#suggestions')),i=links.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=i+(e.key==='ArrowDown'?1:-1);if(n<0)$('#search').focus();else links[n%links.length]?.focus();}if(e.key==='Escape'){closeSuggestions();$('#search').focus();}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search-wrap'))closeSuggestions();});
document.addEventListener('focusin',e=>{if(!e.target.closest('.search-wrap'))closeSuggestions();});
document.addEventListener('keydown',e=>{if($('#viewer').open){if(e.key==='ArrowLeft'){e.preventDefault();nextShot(-1);}if(e.key==='ArrowRight'){e.preventDefault();nextShot(1);}return;}if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.matches('input,textarea,select,[contenteditable]')&&!document.querySelector('dialog[open]')){e.preventDefault();$('#search').focus();}if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();state.libraryTab=e.key==='Home'?'installed':e.key==='End'?'wishes':state.libraryTab==='installed'?'wishes':'installed';render();$('[role="tab"][aria-selected="true"]').focus();}});

/* 10. DÉLÉGATION DES ÉVÉNEMENTS */
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id,action=b.dataset.action;switch(action){
case 'category':{state.category=b.dataset.category;const x=$('.category-strip')?.scrollLeft||0;render();$('.category-strip').scrollLeft=x;$(`[data-category="${state.category}"]`)?.focus({preventScroll:true});break;}
case 'scroll-row':{const row=$('#row-'+b.dataset.row);row.scrollBy({left:Number(b.dataset.direction)*row.clientWidth*.8,behavior:motion.matches?'instant':'smooth'});break;}
case 'prev-slide':case 'next-slide':case 'set-slide':{const selector=action==='set-slide'?`[data-action="set-slide"][data-index="${b.dataset.index}"]`:`[data-action="${action}"]`;changeSlide(action==='set-slide'?Number(b.dataset.index):state.slide+(action==='prev-slide'?-1:1));$(selector)?.focus({preventScroll:true});break;}
case 'pause-carousel':state.heroPaused=!state.heroPaused;$('#hero-controls').innerHTML=heroControls();$('[data-action="pause-carousel"]').focus({preventScroll:true});break;
case 'install':startInstall(id);break;
case 'wish':toggleWish(id);break;
case 'uninstall':requestUninstall(id);break;
case 'cancel-uninstall':$('#confirm-dialog').close();break;
case 'open-app':toast(`${appById(id).name} est prête ! Il s’agit d’une démonstration, aucune app réelle ne s’ouvre.`);break;
case 'view-shot':showShot(id,Number(b.dataset.index));break;
case 'close-viewer':$('#viewer').close();break;
case 'prev-shot':nextShot(-1);break;
case 'next-shot':nextShot(1);break;
case 'read-more':{const p=$('#description'),expanded=b.getAttribute('aria-expanded')==='true';p.classList.toggle('collapsed',expanded);b.setAttribute('aria-expanded',String(!expanded));b.innerHTML=(expanded?'Lire la suite':'Réduire')+icon('right');break;}
case 'toggle-review':{const form=$('#review-form');form.hidden=!form.hidden;b.setAttribute('aria-expanded',String(!form.hidden));if(!form.hidden)$('#review-name').focus();break;}
case 'library-tab':state.libraryTab=b.dataset.tab;render();$('[role="tab"][aria-selected="true"]').focus({preventScroll:true});break;
case 'undo':{const fn=toastUndo;clearTimeout(state.toastTimer);$('#toast').hidden=true;toastUndo=null;if(fn)fn();break;}
case 'dismiss-toast':$('#toast').hidden=true;break;
}});
document.addEventListener('change',e=>{if(e.target.closest('#filters')){const p=getRoute().params;new FormData($('#filters')).forEach((v,k)=>p.set(k,v));const fieldId=e.target.id;liveRouting=true;location.hash='#/search?'+p;setTimeout(()=>$('#'+fieldId)?.focus({preventScroll:true}),0);}});
document.addEventListener('submit',e=>{if(e.target.id==='review-form'){e.preventDefault();submitReview(e.target);}if(e.target.id==='filters')e.preventDefault();});
document.addEventListener('input',e=>{if(e.target.id==='review-name'||e.target.id==='review-text')e.target.setCustomValidity('');});
$('#confirm-dialog').addEventListener('click',e=>{if(e.target===$('#confirm-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer')||e.target.classList.contains('viewer-inner'))$('#viewer').close();});

/* 11. THÈME ET INITIALISATION */
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
function isDark(){return document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':systemTheme.matches;}
function syncThemeButton(){const dark=isDark();$('#theme-toggle').innerHTML=icon(dark?'sun':'moon');$('#theme-toggle').setAttribute('aria-label',dark?'Activer le thème clair':'Activer le thème sombre');$('meta[name="theme-color"]').content=dark?'#141a16':'#f8faf7';}
const theme=storage.read('theme',null);if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
$('#theme-toggle').addEventListener('click',()=>{const next=isDark()?'light':'dark';document.documentElement.dataset.theme=next;storage.write('theme',next);syncThemeButton();});
systemTheme.addEventListener('change',syncThemeButton);syncThemeButton();
$$('[data-brand]').forEach(el=>{el.innerHTML=brandMark+`<span>${esc(PLATFORM_NAME)}</span>`;el.setAttribute('aria-label',PLATFORM_NAME+', accueil');});
$('meta[name="description"]').content=`${PLATFORM_NAME}, votre nouvelle adresse pour découvrir, rechercher et essayer des applications Android originales.`;
$$('[data-platform]').forEach(el=>{el.textContent=PLATFORM_NAME;});$('#year').textContent=new Date().getFullYear();
$$('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon);});
$('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();});
$('.viewer-close').innerHTML=icon('close');$('[data-action="prev-shot"]').innerHTML=icon('left');$('[data-action="next-shot"]').innerHTML=icon('right');
$('#main').innerHTML='<div aria-label="Chargement des applications" role="status"><span class="sr-only">Votre sélection arrive…</span><div class="skeleton loading-hero"></div><div class="loading-row">'+Array.from({length:6},()=>'<div class="skeleton"></div>').join('')+'</div></div>';
setTimeout(()=>render(),motion.matches?0:280);
